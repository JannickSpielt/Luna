# Xcode-Projekt für Lilith. Erzeugen mit:  cd App && xcodegen
# Die .xcodeproj wird nicht eingecheckt, nur diese Datei.
name: Lilith
options:
  bundleIdPrefix: app.lilith
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: "${LILITH_TEAM}"
    CODE_SIGN_STYLE: Automatic
packages:
  LilithKit:
    path: ../Packages/LilithKit
targets:
  Lilith:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: LilithKit
        product: AppFeature
      # Live Activity (nur iPhone/iPad)
      - target: LilithWidgets
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lilith.Lilith
        PRODUCT_NAME: Lilith
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_NSFaceIDUsageDescription: Luna nutzt Face ID, um die App zu entsperren, wenn du die App-Sperre einschaltest.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Luna sichert deine Fotos und Videos auf deinem eigenen Immich-Server. Sie gehen an keinen anderen Dienst.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Luna verbindet sich mit deinem Immich-Server, auch wenn er in deinem Heimnetz steht.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Luna
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
  LilithWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: [Info.plist]
    dependencies:
      - package: LilithKit
        product: LiveAktivitaet
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lilith.Lilith.Widgets
        PRODUCT_NAME: LilithWidgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Luna
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
schemes:
  Lilith:
    build:
      targets:
        Lilith: all
    test:
      config: Debug
