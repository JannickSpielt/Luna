# Nur die Endpunkte, die Lilith wirklich nutzt. Neue Endpunkte hier eintragen
# und danach scripts/generate-api.sh ausführen.
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
filter:
  operations:
    # Server
    - pingServer
    - getServerVersion
    - getServerFeatures
    # Anmeldung
    - login
    - logout
    - validateAccessToken
    # Gesperrter Bereich
    - getAuthStatus
    - setupPinCode
    - unlockAuthSession
    - lockAuthSession
    # Konto
    - getMyUser
    # Timeline
    - getTimeBuckets
    - getTimeBucket
    # Einzelnes Foto
    - getAssetInfo
    - updateAsset
    # Alben
    - getAllAlbums
    - updateAlbumInfo
    - createAlbum
    - addAssetsToAlbum
    # Mehrere Fotos
    - updateAssets
    - deleteAssets
    - restoreAssets
    # Suche
    - searchSmart
    - searchAssets
    - getSearchSuggestions
    # Personen
    - getAllPeople
    - updatePerson
    # Karte
    - getMapMarkers
    # Doppelte Fotos
    - getAssetDuplicates
    - resolveDuplicates
    # Teilen-Links
    - createSharedLink
    - getAllSharedLinks
    - removeSharedLink
    # Ordner
    - getUniqueOriginalPaths
    - getAssetsByOriginalPath
    # Upload
    - checkBulkUpload
