# Nur die Endpunkte, die Lilith wirklich nutzt. Neue Endpunkte hier eintragen
# und danach scripts/generate-api.sh ausführen.
generate:
  - types
  - client
accessModifier: public
namingStrategy: idiomatic
filter:
  operations:
    # Server
    - pingServer
    - getServerVersion
    - getServerFeatures
    # Anmeldung
    - login
    - logout
    - validateAccessToken
    # Konto
    - getMyUser
    # Timeline
    - getTimeBuckets
    - getTimeBucket
    # Einzelnes Foto
    - getAssetInfo
    - updateAsset
    # Alben
    - getAllAlbums
    - createAlbum
    - addAssetsToAlbum
    # Mehrere Fotos
    - updateAssets
    - deleteAssets
    - restoreAssets
